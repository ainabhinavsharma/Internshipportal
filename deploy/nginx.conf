# Nginx Configuration for DBERT Internship Portal
# Target Server Path: /var/www/apps/internship
# Domain: https://internship.dbert.online/

# 1. HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name internship.dbert.online;

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Main HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name internship.dbert.online;

    # SSL Certificates (managed by Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/internship.dbert.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/internship.dbert.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Maximum upload size (matches app 6MB limit + buffer)
    client_max_body_size 10M;

    # Direct Static Asset Serving (High Performance)
    location /static/ {
        alias /var/www/apps/internship/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Uploads directory - prevent execution of any uploaded scripts
    location /uploads/ {
        alias /var/www/apps/internship/uploads/;
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff";
        types {
            image/png png;
            image/jpeg jpg jpeg;
            application/pdf pdf;
        }
        default_type application/octet-stream;
    }

    # Reverse Proxy to Gunicorn WSGI Application
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;

        # WebSocket / Long-polling timeouts
        proxy_read_timeout 90;
        proxy_connect_timeout 90;
        proxy_send_timeout 90;
    }
}
